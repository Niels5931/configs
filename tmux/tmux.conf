set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g display-time 2000
set -g focus-events on
set -g aggressive-resize on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind r source-file ~/.config/tmux/tmux.conf \; display "  reloaded"

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind p paste-buffer

_dark="#2e3440"
_mid="#3b4252"
_muted="#44475a"
_fg="#d8dee9"
_comment="#6272a4"
_cyan="#88c0d0"
_blue="#81a1c1"
_purple="#bd93f9"
_red="#bf616a"
_orange="#d08770"
_yellow="#ebcb8b"
_green="#a3be8c"

set -g status-style "bg=${_dark},fg=${_fg}"
set -g status-justify left
set -g status-interval 5

set -g status-left ""
set -g status-left-length 0

set -g status-right "\
#[fg=${_mid},bg=${_dark}]\
#[fg=${_fg},bg=${_mid}]  #(LC_TIME=en_US.UTF-8 date +'%H:%M   %A, %B %d')  \
#[fg=${_cyan},bg=${_mid}]\
#[fg=${_dark},bg=${_cyan},bold] 󰥔  "

set -g status-right-length 60

setw -g window-status-format "\
 #[fg=#(~/.config/tmux/window-color.sh #{window_index}),bg=${_mid}] #I  #W \
"

setw -g window-status-current-format "\
 #[fg=${_dark},bg=${_purple},bold] #I  #W \
"

setw -g window-status-separator " "

set -g pane-border-style "fg=${_mid}"
set -g pane-active-border-style "fg=${_cyan}"

set -g message-style "bg=${_muted},fg=${_fg}"
set -g message-command-style "bg=${_muted},fg=${_fg}"

setw -g clock-mode-colour "${_cyan}"
setw -g clock-mode-style 24

setw -g monitor-activity on
set -g visual-activity off
setw -g allow-rename off
setw -g automatic-rename on